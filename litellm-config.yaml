model_list:
  # 🔒 SECURED: Safety system prompt injected by the gateway
  - model_name: secured-llama
    litellm_params:
      model: openai/meta-llama-3.1-8b-instruct
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "not-needed"
      guardrails: ["runtime-security-guard"]

  # 🔓 PRIVATE: 100% Local — no gateway-level controls
  - model_name: private-llama
    litellm_params:
      model: openai/meta-llama-3.1-8b-instruct
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "not-needed"
      # NO guardrails — raw model access

general_settings:
  disable_spend_logs: true
  disable_reset_budget: true

guardrails:
  - guardrail_name: "runtime-security-guard"
    litellm_params:
      guardrail: "panw_prisma_airs"
      mode: ["pre_call", "post_call"]
      profile_name: "LlamaProfile"
      api_key: "os.environ/PANW_PRISMA_AIRS_API_KEY"
